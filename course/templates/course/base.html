{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ course.title }}{% endblock %} · Hebrew University</title>
  <link rel="stylesheet" href="{% static 'course/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="{% url 'home' %}">{{ course.title }}</a>
      <nav>
        <a href="{% url 'home' %}">Home</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container site-footer">
    The Hebrew University of Jerusalem · {{ course.title }} course intranet
  </footer>
</body>
</html>
