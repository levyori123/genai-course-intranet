{% extends "course/base.html" %}
{% block title %}Enter{% endblock %}
{% block content %}
<section class="enter">
  <div class="card enter-card">
    <h1>Course access</h1>
    <p id="enter-help" class="meta">Enter the course password your instructor shared to continue.</p>
    {% if error %}<p id="enter-error" class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'enter' %}" class="enter-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required autofocus{% if error %} aria-invalid="true" aria-describedby="enter-error enter-help"{% else %} aria-describedby="enter-help"{% endif %}>
      <button type="submit" class="btn">Enter</button>
    </form>
  </div>
</section>
{% endblock %}
