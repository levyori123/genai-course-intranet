{% extends "course/base.html" %}
{% block title %}Enter{% endblock %}
{% block content %}
<section class="hero">
  <h1>Course access</h1>
  <p>Enter the course password your instructor shared to continue.</p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{% url 'enter' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Enter</button>
  </form>
</section>
{% endblock %}
